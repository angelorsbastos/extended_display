# Builds the iPad app on GitHub's free macOS machines (no Mac needed) and
# publishes it as a GitHub Release, together with source.json.
# SideStore follows that source, so each push shows up on the iPad as
# "Update available". Source URL to add in SideStore:
#   https://github.com/angelorsbastos/wingman/releases/latest/download/source.json
name: Build iPad app

on:
  push:
    branches: [main]
    paths: ["ipad/**", ".github/workflows/build-ipad.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to create releases

# a newer push replaces a build that is still waiting or running
concurrency:
  group: build-ipad
  cancel-in-progress: true

jobs:
  build:
    # Apple-silicon Macs. When GitHub has no Mac of a kind free, the job fails
    # with "not acquired by Runner" without building: then switch to the other
    # kind (macos-15 <-> macos-15-intel; Intel is being retired, so it's scarce).
    # Either kind builds the same iPad app.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ipad
    env:
      VERSION: 0.1.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          # on failure, re-print compiler errors as annotations so they show
          # on the run's summary page instead of being buried in the log
          set -o pipefail
          xcodebuild build \
            -project Wingman.xcodeproj \
            -scheme Wingman \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log || {
              grep -E "error:" build.log | sort -u | head -40 | while read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Check app version matches the source
        run: |
          # SideStore refuses the install if these differ from source.json
          plist=build/Build/Products/Release-iphoneos/Wingman.app/Info.plist
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$plist")
          b=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$plist")
          echo "app says $v ($b), expected $VERSION ($BUILD)"
          [ "$v" = "$VERSION" ] && [ "$b" = "$BUILD" ] || { echo "::error::version mismatch"; exit 1; }

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Wingman.app Payload/
          zip -qry Wingman.ipa Payload

      - name: Publish release + source.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$BUILD"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/Wingman.ipa"
          python3 make_source.py "$VERSION" "$BUILD" Wingman.ipa "$url" source.json
          # SideStore reads the "latest" release; never let an older build that
          # finished late (e.g. a re-run) take that over from a newer one
          # (only build-N tags: the Windows installer has its own "windows" release)
          newest=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(startswith("build-")) | ltrimstr("build-") | tonumber] | max // 0')
          latest=true
          if [ "$newest" -gt "$BUILD" ]; then latest=false; fi
          gh release create "$tag" Wingman.ipa source.json \
            --title "Wingman $VERSION" \
            --notes "Built from ${{ github.sha }}" \
            --latest="$latest"
