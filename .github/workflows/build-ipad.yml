# Builds the iPad app on GitHub's free macOS machines (no Mac needed).
# The result is an unsigned .ipa; SideStore signs it with your free Apple ID.
# Download it from the run's "Artifacts" section on GitHub.
name: Build iPad app

on:
  push:
    branches: [main]
    paths: ["ipad/**", ".github/workflows/build-ipad.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ipad
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          # on failure, re-print compiler errors as annotations so they show
          # on the run's summary page instead of being buried in the log
          set -o pipefail
          xcodebuild build \
            -project ExtendDisplay.xcodeproj \
            -scheme ExtendDisplay \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log || {
              grep -E "error:" build.log | sort -u | head -40 | while read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ExtendDisplay.app Payload/
          zip -qry ExtendDisplay.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ExtendDisplay-ipa
          path: ipad/ExtendDisplay.ipa
