# Builds the laptop side as a normal Windows installer (no Python needed) on
# GitHub's free Windows machines, checks that it starts, and publishes it on
# the "windows" release, always under the same link:
#   https://github.com/angelorsbastos/wingman/releases/download/windows/Wingman-Setup.exe
# That release is never marked "latest": SideStore reads the latest release
# for the iPad app (build-ipad.yml).
name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ["pc/**", "packaging/**", "requirements.txt", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to update the release

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    env:
      VERSION: "0.2.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Wingman's packages and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0

      - name: Build Wingman.exe
        run: python -m PyInstaller packaging\wingman.spec --noconfirm

      - name: Check that it starts
        shell: pwsh
        run: |
          $process = Start-Process dist\Wingman\Wingman.exe -PassThru
          Start-Sleep 25
          $log = Join-Path $env:APPDATA "Wingman\hub.log"
          if (Test-Path $log) { Get-Content $log }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern "--- started" -Quiet)) {
            throw "Wingman.exe didn't start (no hub.log)"
          }
          if (Select-String -Path $log -Pattern "Traceback|ModuleNotFoundError|ImportError" -Quiet) {
            throw "Wingman.exe started with errors (see the log above)"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\wingman.iss
          Copy-Item "dist\Wingman-Setup-$env:VERSION.exe" dist\Wingman-Setup.exe

      - name: Publish on the "windows" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Wingman for Windows $VERSION, built from ${{ github.sha }}. Download Wingman-Setup.exe and run it; see the README for the rest."
          if ! gh release view windows >/dev/null 2>&1; then
            gh release create windows --title "Wingman for Windows" --notes "$notes" --latest=false
          fi
          gh release edit windows --title "Wingman for Windows $VERSION" --notes "$notes" --latest=false
          gh release upload windows dist/Wingman-Setup.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Wingman-Setup
          path: dist/Wingman-Setup-*.exe
