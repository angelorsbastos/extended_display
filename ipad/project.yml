# XcodeGen spec: the GitHub Actions build turns this into Wingman.xcodeproj,
# so we never have to edit an Xcode project file by hand on Windows.
name: Wingman
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Wingman:
    type: application
    platform: iOS
    sources: [Wingman, Shared]
    scheme: {}
    dependencies:
      - target: WingmanWidgets  # embedded in the app (PlugIns)
      - target: WingmanShare
    # shared with the extensions (what the widgets show); SideStore renames it
    # per Apple ID and says the real name in ALTAppGroups (WidgetSnapshot.appGroup)
    entitlements:
      path: Wingman/Wingman.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.extenddisplay.app]
    settings:
      base:
        # the app's original id, kept: changing it would make iOS see a new app
        # (reinstall, pair again, settings lost)
        PRODUCT_BUNDLE_IDENTIFIER: dev.extenddisplay.app
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone and iPad (the iPhone gets its own home screen)
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the CI build overrides these with the run number, so every build is newer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Wingman/Info.plist
      properties:
        CFBundleDisplayName: Wingman
        # XcodeGen writes literal 1.0 / 1 unless told to use the build settings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}  # without this iOS shows the app letterboxed
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        # the Dock timer on the Lock Screen and in the Dynamic Island
        NSSupportsLiveActivities: true
        # wingman:// links from the widgets and Control Center buttons
        CFBundleURLTypes:
          - CFBundleURLName: dev.extenddisplay.app
            CFBundleURLSchemes: [wingman]
        # keeps running after leaving the app: Picture in Picture, the laptop's sound
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:  # iPhone: no upside-down
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: Connects to Wingman on your laptop over Wi-Fi.
        # announced so the laptop can find the iPad on the Wi-Fi (like AirPlay)
        NSBonjourServices:
          - _extenddisplay._tcp  # original name, kept: see StreamServer.bonjourType
        # trackpad clicks arrive as pointer events (needed for pointer lock)
        UIApplicationSupportsIndirectInputEvents: true
        # scene-based UIKit startup: SceneDelegate sets a root controller that can
        # lock the pointer (SwiftUI's own window can't)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # files from the laptop show in the Files app (On My iPad > Wingman)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # any file can be shared to the app (Share > Wingman) to send it to the laptop
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.item, public.data, public.content]
        NSPhotoLibraryUsageDescription: Lets you pick photos and videos to send to the laptop.

  # Widgets, the timer's Live Activity and Control Center buttons (iOS 18+;
  # older systems simply don't get them). They read what the app saved in the
  # app group and open the app (wingman://) to act: only the app reaches the laptop.
  WingmanWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [WingmanWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.extenddisplay.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: WingmanWidgets/WingmanWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.extenddisplay.app]
    info:
      path: WingmanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Wingman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Share > Wingman: saves photos, screenshots and files in the app group's
  # outbox and opens the app, which sends them to the laptop.
  WingmanShare:
    type: app-extension
    platform: iOS
    sources: [WingmanShare, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.extenddisplay.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # opening the app from the extension uses UIApplication through the
        # responder chain, which App Store rules forbid but sideloading allows
        APPLICATION_EXTENSION_API_ONLY: NO
    entitlements:
      path: WingmanShare/WingmanShare.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.extenddisplay.app]
    info:
      path: WingmanShare/Info.plist
      properties:
        CFBundleDisplayName: Wingman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 20
