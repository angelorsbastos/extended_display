# XcodeGen spec: the GitHub Actions build turns this into ExtendDisplay.xcodeproj,
# so we never have to edit an Xcode project file by hand on Windows.
name: ExtendDisplay
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  ExtendDisplay:
    type: application
    platform: iOS
    sources: [ExtendDisplay]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.extenddisplay.app
        TARGETED_DEVICE_FAMILY: "2"  # iPad only
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the CI build overrides these with the run number, so every build is newer
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: ExtendDisplay/Info.plist
      properties:
        CFBundleDisplayName: Extend Display
        # XcodeGen writes literal 1.0 / 1 unless told to use the build settings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}  # without this iOS shows the app letterboxed
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSLocalNetworkUsageDescription: Connects to Extend Display on your laptop over Wi-Fi.
        # announced so the laptop can find the iPad on the Wi-Fi (like AirPlay)
        NSBonjourServices:
          - _extenddisplay._tcp
        # trackpad clicks arrive as pointer events (needed for pointer lock)
        UIApplicationSupportsIndirectInputEvents: true
        # scene-based UIKit startup: SceneDelegate sets a root controller that can
        # lock the pointer (SwiftUI's own window can't)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
